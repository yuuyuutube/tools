<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Sunburst · 插畫窗格與圖片位置</title><style>
*{box-sizing:border-box}body{margin:0;background:#e8e4dc;color:#302c27;font:14px system-ui}main{max-width:1600px;margin:auto;padding:24px 20px 64px}
h1{font-size:25px;margin:8px 0}p{line-height:1.8;color:#655e54;max-width:920px;margin:6px 0}.status{letter-spacing:2px;color:#866e4d}a{color:inherit;text-underline-offset:4px}
.layout{display:grid;grid-template-columns:minmax(300px,440px) 1fr;gap:28px;margin-top:18px;align-items:start}
.editor{position:sticky;top:12px;display:flex;flex-direction:column;gap:14px}
#big{display:block;width:100%;height:auto;border-radius:10px;box-shadow:0 12px 30px -20px #302010aa;touch-action:none;background:#f6efe0}
#big:focus-visible{outline:3px solid #b2532c;outline-offset:3px}
.panel{background:#f4eee3;border:1px solid #d3c9b8;border-radius:10px;padding:14px 16px;display:grid;gap:10px}
.panel h2{font-size:14px;margin:0;color:#302c27}.panel h2 small{font-weight:400;color:#866e4d;margin-left:6px}
.row{display:grid;grid-template-columns:72px 1fr 74px;gap:10px;align-items:center}.row label{font-weight:600}
input[type=range]{width:100%;accent-color:#b2532c}input[type=number]{width:100%;padding:5px 6px;font:inherit;border:1px solid #beb4a5;border-radius:5px;background:#fbf7ee}
.meta{font-size:13px;color:#655e54;line-height:1.7}.meta b{color:#302c27}
.buttons{display:flex;flex-wrap:wrap;gap:8px;align-items:center}button{padding:7px 14px;font:inherit;background:#fbf7ee;border:1px solid #beb4a5;border-radius:18px;cursor:pointer;color:inherit}button:hover{background:#fff}
.check{display:flex;gap:6px;align-items:center;font-size:13px}
code{display:block;font:12px ui-monospace,Consolas,monospace;background:#fbf7ee;border:1px solid #d3c9b8;border-radius:6px;padding:8px;white-space:pre-wrap;word-break:break-all;color:#302c27}
.deck{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px 12px}
.card{display:flex;flex-direction:column;align-items:center;gap:6px;padding:7px;border-radius:8px;background:#ebe7de;border:2px solid transparent;cursor:pointer}
.card:hover{background:#ded7c9}.card[aria-pressed=true]{border-color:#b2532c}.card canvas{display:block;width:100%;height:auto}.card span{font-size:12px;text-align:center}.card b{color:#b2532c;font-weight:600}
#copied{font-size:12px;color:#866e4d}
@media(max-width:820px){.layout{grid-template-columns:1fr}.editor{position:static}}
</style></head><body><main>
<div class="status">SUNBURST · WINDOW &amp; ART POSITION</div>
<h1>插畫窗格與圖片位置</h1>
<p>目前套用的窗格是 218 × 290（牌面單位，整張牌 300 × 500，輸出 ×3）。在左邊大圖：<b>拖曳窗格裡面</b>可以上下移動這張牌的圖片；拖曳窗格的邊可以再內縮窗格（相對目前窗格，左右對稱）。大圖選取後也可以用鍵盤 ↑ ↓ 微調（按住 Shift 一次 2）。</p>
<p>沒有調整的牌顯示實際成品；調整過的牌改用平塗預覽（含出血的完整插圖），看得出位置，但沒有印刷紋理。調好後按「複製設定」貼給我，我再重新輸出。</p>
<p><a href="sunburst-batch.html?view=all">← 回到 1–21 全套總覽</a></p>
<div class="layout">
 <section class="editor">
  <canvas id="big" width="900" height="1500" tabindex="0" aria-label="可拖曳的牌面：拖曳窗格內移動圖片，拖曳窗格邊緣內縮窗格"></canvas>
  <div class="panel">
   <h2 id="card-title">圖片上下位置</h2>
   <div class="row"><label for="offset">上下</label><input type="range" id="offset-range" step="0.5"><input type="number" id="offset" step="0.5"></div>
   <div class="meta" id="offset-meta"></div>
   <div class="buttons"><button id="offset-reset" type="button">這張歸零</button><button id="offset-reset-all" type="button">全部歸零</button></div>
  </div>
  <div class="panel">
   <h2>窗格內縮<small>相對目前窗格</small></h2>
   <div class="row"><label for="top">上</label><input type="range" id="top-range" min="0" max="60" step="0.5"><input type="number" id="top" min="0" max="60" step="0.5"></div>
   <div class="row"><label for="bottom">下</label><input type="range" id="bottom-range" min="0" max="60" step="0.5"><input type="number" id="bottom" min="0" max="60" step="0.5"></div>
   <div class="row"><label for="side">左右</label><input type="range" id="side-range" min="0" max="40" step="0.5"><input type="number" id="side" min="0" max="40" step="0.5"></div>
   <div class="meta" id="meta"></div>
   <label class="check"><input type="checkbox" id="ghost" checked>顯示目前窗格（虛線）</label>
  </div>
  <div class="panel">
   <div class="buttons"><button id="copy" type="button">複製設定</button><button id="reset" type="button">窗格內縮歸零</button><span id="copied" aria-live="polite"></span></div>
   <code id="path"></code>
  </div>
 </section>
 <section><div class="deck" id="deck"></div></section>
</div>
</main>
<script type="module">
import {BATCH} from './src/print/sunburst/registry.js';
import {MAP as FOOL_MAP} from './src/print/sunburst/fool-masks.js';
import {WINDOW,ART_SHIFT,ART_OFFSET} from './src/print/sunburst/layout.js';
import {cardById} from './src/data/cards.js';

// Current window from layout.js ('M{x0} {y1}V{y0+r}a{r} … h{w-2r} …').
const W0=(()=>{const n=WINDOW.match(/-?[\d.]+/g).map(Number),[x0,y1,yr,r]=[n[0],n[1],n[2],n[3]],w=n[10];return {x0,y1,y0:yr-r,r,x1:x0+2*r+w};})();
const INK='rgb(30,40,74)',STROKE=2.8,ACCENT='#b2532c',STORE='sunburst-window-editor-v2',APPLIED=JSON.stringify(ART_OFFSET);
const state={top:0,bottom:0,side:0,ghost:true,current:0,offsets:{...ART_OFFSET},applied:APPLIED};
try{const saved=JSON.parse(localStorage.getItem(STORE)||'{}');Object.assign(state,saved);if(saved.applied!==APPLIED){state.offsets={...ART_OFFSET};state.applied=APPLIED;}}catch{}

const win=()=>({x0:W0.x0+state.side,x1:W0.x1-state.side,y0:W0.y0+state.top,y1:W0.y1-state.bottom});
const windowPath=(x0,y0,x1,y1,r)=>{r=Math.min(r,(x1-x0)/2,y1-y0);const p=new Path2D();p.moveTo(x0,y1);p.lineTo(x0,y0+r);p.arcTo(x0,y0,x0+r,y0,r);p.lineTo(x1-r,y0);p.arcTo(x1,y0,x1,y0+r,r);p.lineTo(x1,y1);p.closePath();return p;};
const fmt=v=>+v.toFixed(2);
const svgPath=({x0,y0,x1,y1})=>{const r=Math.min(W0.r,(x1-x0)/2,y1-y0);return `M${fmt(x0)} ${fmt(y1)}V${fmt(y0+r)}a${fmt(r)} ${fmt(r)} 0 0 1 ${fmt(r)} -${fmt(r)}h${fmt(x1-x0-2*r)}a${fmt(r)} ${fmt(r)} 0 0 1 ${fmt(r)} ${fmt(r)}v${fmt(y1-y0-r)}z`;};
const off=n=>state.offsets[n]||0;
const windowChanged=()=>state.top||state.bottom||state.side;
const edited=n=>off(n)!==(ART_OFFSET[n]||0);

const cards=Array.from({length:22},(_,n)=>{
 const cfg=n===0?{id:'fool',map:FOOL_MAP}:BATCH[n],card=cardById(cfg.id);
 const final=n===0?'docs/tarot-sunburst/fool-pipeline/fool-final-3x5.png':`docs/tarot-sunburst/batch-${cfg.batch}/${n}-final-3x5.png`;
 // Art top in card units at offset 0, and its height; the art must keep covering the window.
 const top=cfg.map.y+ART_SHIFT.y,height=1536*cfg.map.scale;
 return {n,label:`${card.romanNumeral} · ${card.nameZh}`,map:cfg.map,top,height,final,art:`docs/tarot-sunburst/art-preview/${n}.webp`,img:null,artImg:null,paper:'#f3ecdc'};
});
const bounds=c=>{const w=win();return [Math.ceil((w.y1-(c.top+c.height))*2)/2,Math.floor((w.y0-c.top)*2)/2];};
const load=src=>new Promise((ok,fail)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=fail;i.src=src+'?'+Date.now();});
// Paper colour: the strip between the window and the rule line under it.
function samplePaper(img){const c=document.createElement('canvas');c.width=720;c.height=12;const g=c.getContext('2d',{willReadFrequently:true});g.drawImage(img,90,3*(W0.y1+5),720,12,0,0,720,12);const d=g.getImageData(0,0,720,12).data;let r=0,gr=0,b=0,k=0;for(let i=0;i<d.length;i+=4){if(d[i]+d[i+1]+d[i+2]<540)continue;r+=d[i];gr+=d[i+1];b+=d[i+2];k++;}return k?`rgb(${r/k|0},${gr/k|0},${b/k|0})`:'#f3ecdc';}

function compose(canvas,card,{editor=false}={}){
 const g=canvas.getContext('2d'),s=canvas.width/300;g.setTransform(1,0,0,1,0,0);g.fillStyle='#f6efe0';g.fillRect(0,0,canvas.width,canvas.height);
 if(!card.img)return;g.drawImage(card.img,0,0,canvas.width,canvas.height);g.setTransform(s,0,0,s,0,0);
 const w=win(),inner=windowPath(w.x0,w.y0,w.x1,w.y1,W0.r);
 if(windowChanged()||edited(card.n)){
  // Replace the printed window with the flat preview at the new position.
  g.fillStyle=card.paper;g.fill(windowPath(W0.x0-2.4,W0.y0-2.4,W0.x1+2.4,W0.y1+2.4,W0.r+2.4));
  if(card.artImg){g.save();g.clip(inner);g.translate(card.map.x+ART_SHIFT.x,card.top+off(card.n));g.scale(card.map.scale,card.map.scale);g.drawImage(card.artImg,0,0,1024,1536);g.restore();}
  g.strokeStyle=INK;g.lineWidth=STROKE;g.lineJoin='round';g.stroke(inner);
 }
 if(!editor)return;
 if(state.ghost&&windowChanged()){g.save();g.setLineDash([4,3]);g.strokeStyle=ACCENT;g.globalAlpha=.7;g.lineWidth=1;g.stroke(windowPath(W0.x0,W0.y0,W0.x1,W0.y1,W0.r));g.restore();}
 g.fillStyle=ACCENT;const cx=(w.x0+w.x1)/2,cy=(w.y0+w.y1)/2,grip=(x,y,horiz)=>{const a=horiz?18:5,b=horiz?5:18;g.beginPath();g.roundRect(x-a/2,y-b/2,a,b,2.5);g.fill();};
 grip(cx,w.y0,true);grip(cx,w.y1,true);grip(w.x0,cy,false);grip(w.x1,cy,false);
}

const big=document.getElementById('big'),deck=document.getElementById('deck');
const thumbs=cards.map(card=>{const b=document.createElement('button');b.type='button';b.className='card';const c=document.createElement('canvas');c.width=300;c.height=500;const t=document.createElement('span');b.append(c,t);b.addEventListener('click',()=>{state.current=card.n;save();draw();big.scrollIntoView({block:'nearest',behavior:'smooth'});});deck.append(b);return {b,c,t};});

const insets=['top','bottom','side'];
function clampState(){const w=W0.x1-W0.x0,h=W0.y1-W0.y0;state.side=Math.max(0,Math.min(state.side,w/2-40));state.top=Math.max(0,Math.min(state.top,h-60-state.bottom));state.bottom=Math.max(0,Math.min(state.bottom,h-60-state.top));for(const k of insets)state[k]=Math.round(state[k]*2)/2;
 for(const c of cards){const [lo,hi]=bounds(c),v=Math.round(off(c.n)*2)/2,cl=Math.max(lo,Math.min(hi,v));if(cl)state.offsets[c.n]=cl;else delete state.offsets[c.n];}}
function save(){try{localStorage.setItem(STORE,JSON.stringify(state));}catch{}}
let pending=false;function draw(){if(pending)return;pending=true;requestAnimationFrame(()=>{pending=false;render();});}
const arrow=v=>v>0?`↓${v}`:v<0?`↑${-v}`:'';
function render(){
 clampState();const w=win(),c=cards[state.current],[lo,hi]=bounds(c);
 for(const k of insets){document.getElementById(k).value=state[k];document.getElementById(k+'-range').value=state[k];}
 for(const id of ['offset','offset-range']){const el=document.getElementById(id);el.min=lo;el.max=hi;el.value=off(c.n);}
 document.getElementById('card-title').textContent=`圖片上下位置 · ${c.label}`;
 document.getElementById('offset-meta').innerHTML=`目前 <b>${off(c.n)>0?'往下 '+off(c.n):off(c.n)<0?'往上 '+(-off(c.n)):'不動'}</b>（牌面單位，輸出 ×3 px）· 可調範圍 ${lo} ～ ${hi}，超過就會露出圖片邊緣`;
 document.getElementById('ghost').checked=state.ghost;
 document.getElementById('meta').innerHTML=`窗格：<b>${fmt(w.x1-w.x0)} × ${fmt(w.y1-w.y0)}</b>（目前 ${W0.x1-W0.x0} × ${W0.y1-W0.y0}）· 左上角 (${fmt(w.x0)}, ${fmt(w.y0)})`;
 const offsets=Object.fromEntries(Object.entries(state.offsets).filter(([,v])=>v).sort((a,b)=>a[0]-b[0]));
 document.getElementById('path').textContent=`窗格內縮：上 ${state.top}、下 ${state.bottom}、左右 ${state.side}（相對目前窗格）\nWINDOW = '${svgPath(w)}'\nART_OFFSET = ${JSON.stringify(offsets)}`;
 compose(big,c,{editor:true});
 thumbs.forEach(({b,c:cv,t},i)=>{b.setAttribute('aria-pressed',String(i===state.current));compose(cv,cards[i]);t.innerHTML=cards[i].label+(off(i)?` <b>${arrow(off(i))}</b>`:'');});
}
for(const k of insets)for(const id of [k,k+'-range'])document.getElementById(id).addEventListener('input',e=>{const v=parseFloat(e.target.value);if(Number.isFinite(v)){state[k]=v;save();draw();}});
for(const id of ['offset','offset-range'])document.getElementById(id).addEventListener('input',e=>{const v=parseFloat(e.target.value);if(Number.isFinite(v)){state.offsets[state.current]=v;save();draw();}});
document.getElementById('offset-reset').addEventListener('click',()=>{delete state.offsets[state.current];save();draw();});
document.getElementById('offset-reset-all').addEventListener('click',()=>{state.offsets={};save();draw();});
document.getElementById('ghost').addEventListener('change',e=>{state.ghost=e.target.checked;save();draw();});
document.getElementById('reset').addEventListener('click',()=>{state.top=state.bottom=state.side=0;save();draw();});
document.getElementById('copy').addEventListener('click',async()=>{const out=document.getElementById('copied');try{await navigator.clipboard.writeText(document.getElementById('path').textContent);out.textContent='已複製';}catch{out.textContent='無法複製，請手動選取下方文字';}setTimeout(()=>out.textContent='',2400);});

// Big card: drag an edge to inset the window (sides mirrored); drag inside it to move the art.
let drag=null;
const toUnits=e=>{const r=big.getBoundingClientRect();return {x:(e.clientX-r.left)/r.width*300,y:(e.clientY-r.top)/r.height*500,tol:10/r.width*300};};
function hit(p){const w=win(),inX=p.x>w.x0-p.tol&&p.x<w.x1+p.tol,inY=p.y>w.y0-p.tol&&p.y<w.y1+p.tol;
 const c=[['top',Math.abs(p.y-w.y0),inX],['bottom',Math.abs(p.y-w.y1),inX],['side',Math.abs(p.x-w.x0),inY],['side',Math.abs(p.x-w.x1),inY]].filter(([,d,ok])=>ok&&d<=p.tol).sort((a,b)=>a[1]-b[1]);
 if(c[0])return c[0][0];return p.x>w.x0&&p.x<w.x1&&p.y>w.y0&&p.y<w.y1?'art':null;}
big.addEventListener('pointerdown',e=>{const p=toUnits(e),edge=hit(p);if(!edge)return;drag={edge,y0:p.y,off0:off(state.current)};try{big.setPointerCapture(e.pointerId);}catch{}if(edge==='art')big.style.cursor='grabbing';e.preventDefault();});
big.addEventListener('pointermove',e=>{const p=toUnits(e);
 if(!drag){const edge=hit(p);big.style.cursor=edge==='side'?'ew-resize':edge==='art'?'grab':edge?'ns-resize':'default';return;}
 if(drag.edge==='art')state.offsets[state.current]=drag.off0+(p.y-drag.y0);
 else if(drag.edge==='top')state.top=p.y-W0.y0;else if(drag.edge==='bottom')state.bottom=W0.y1-p.y;else state.side=p.x<150?p.x-W0.x0:W0.x1-p.x;draw();});
const end=()=>{if(drag){drag=null;big.style.cursor='default';save();}};big.addEventListener('pointerup',end);big.addEventListener('pointercancel',end);
big.addEventListener('keydown',e=>{if(e.key!=='ArrowUp'&&e.key!=='ArrowDown')return;e.preventDefault();state.offsets[state.current]=off(state.current)+(e.key==='ArrowDown'?1:-1)*(e.shiftKey?2:.5);save();draw();});

render();
await Promise.all(cards.map(async card=>{
 try{card.img=await load(card.final);card.paper=samplePaper(card.img);}catch{card.label+='（成品載入失敗）';}
 try{card.artImg=await load(card.art);}catch{card.label+='（插圖載入失敗）';}
 draw();
}));
</script></body></html>
