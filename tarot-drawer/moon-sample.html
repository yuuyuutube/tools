<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>月亮 · 歐洲寓言木刻樣張</title>
<style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#e8e4dc;color:#24221f;font-family:system-ui,sans-serif}main{max-width:1000px;margin:auto}h1{font-size:20px;margin:0 0 8px}.intro{font-size:13px;color:#716b63;margin:0 0 24px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:28px}figure{margin:0;text-align:center}figcaption{font-size:13px;margin-bottom:14px}.large{display:block;width:100%;max-width:360px;height:auto;margin:auto;border-radius:5.4% / 3.2%;box-shadow:0 14px 26px -16px #40302080}.small{display:block;width:120px;height:auto;margin:24px auto;border-radius:6px}a{display:inline-block;padding:10px 18px;background:#fbfaf6;border:1px solid #c7c0b5;border-radius:24px;color:#24221f;font-size:13px;text-decoration:none;margin:20px 0}.detail{max-width:460px;margin:32px auto} .detail canvas{width:100%;height:auto} @media(max-width:600px){body{padding:16px}.pair{gap:16px}}</style>
<main><h1>XVIII · 月光下的岔路</h1><p class="intro">灰紫夜色、鼠尾草綠地景與淡杏色月光 · 歐洲寓言木刻</p><div class="pair"><figure><figcaption>BEFORE · 原版</figcaption><div id="before"></div></figure><figure><figcaption>AFTER · 新版試畫</figcaption><canvas id="after" class="large"></canvas><canvas id="small" class="small"></canvas><a id="download" download="moon-sample.png">下載新版月亮 PNG</a></figure></div><figure class="detail"><figcaption>局部 · 動物、石塔與路徑</figcaption><canvas id="detail"></canvas></figure></main>
<script type="module">
import {cardById} from './src/data/cards.js';import {faceSVG} from './src/art/frame.js';import {printCard} from './src/print/press.js?v=extra-plates-1';import {moonPlates,MOON_INKS} from './src/print/moon.js?v=symbols-2';
const card=cardById('moon');
const reference=new URLSearchParams(location.search).get('reference');
if(reference==='hermit'){
 const {hermitPlates}=await import('./src/print/hermit.js?v=symbols-2');
 const original=await printCard(hermitPlates(cardById('hermit')),{seed:20261115,scale:3});original.className='large';document.getElementById('before').append(original);
 document.querySelector('.pair figcaption').textContent='筆觸參照 · 隱者修訂版';
}else{document.getElementById('before').innerHTML=faceSVG(card);document.querySelector('#before svg').classList.add('large');}

const cv=await printCard(moonPlates(card),{seed:20261116,scale:3,inks:MOON_INKS,quietAreas:[{x:150,y:127,rx:47,ry:47},{x:110,y:279,rx:26,ry:20},{x:219,y:257,rx:30,ry:30}]});
for(const id of ['after','small']){const el=document.getElementById(id);el.width=cv.width;el.height=cv.height;el.getContext('2d').drawImage(cv,0,0);}
const detail=document.getElementById('detail');detail.width=720;detail.height=486;detail.getContext('2d').drawImage(cv,30*3,192*3,240*3,162*3,0,0,720,486);
document.getElementById('download').href=cv.toDataURL('image/png');
</script></html>
