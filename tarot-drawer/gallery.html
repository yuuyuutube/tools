<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>牌面圖鑑 · Before / After</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:24px;background:#e8e4dc;color:#302c27;font:14px system-ui}header{max-width:1100px;margin:0 auto 28px}h1{font-size:26px}p{line-height:1.7;color:#6e675f}a{color:inherit}#grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,var(--w,480px)),1fr));gap:32px;max-width:1600px;margin:auto}article{padding:20px;background:#f2eee6;border-radius:16px}h2{font-size:19px;margin:0 0 18px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}figure{margin:0}figcaption{font-size:12px;color:#71695e;margin-bottom:10px}svg,img,canvas{display:block;width:100%;height:auto;border-radius:10px;box-shadow:0 8px 24px -14px #40302088}.pending{aspect-ratio:3/5;display:grid;place-items:center;color:#81796e;border:1px dashed #c9c0b2;border-radius:10px}.download{display:inline-block;margin-top:12px;font-size:12px}.back{max-width:220px}button{font:inherit;padding:8px 14px;border:1px solid #bdb4a6;border-radius:20px;background:#faf7f0;cursor:pointer}article[hidden]{display:none}@media(max-width:600px){body{padding:16px}article{padding:12px}.pair{gap:12px}}
</style></head><body><header><h1>牌面圖鑑 · Before / After</h1><p>原版與最新重繪並排。新版仍為樣張，確認狀態不代表已接入正式抽牌。</p><button id="toggle" aria-pressed="false">只看已有新版的牌</button><p id="progress" role="status"></p></header><main id="grid"></main>
<script type="module">
import {CARDS} from './src/data/cards.js';
import {faceSVG,backSVG} from './src/art/frame.js';
import {PRINTS} from './src/print/registry.js';
import {printCard} from './src/print/press.js';
const q=new URLSearchParams(location.search),only=q.get('only')?.split(',');
if(q.get('w'))document.body.style.setProperty('--w',Math.max(240,Math.min(1200,Number(q.get('w'))||480))+'px');
const grid=document.getElementById('grid');
if(!only||only.includes('back')){const a=document.createElement('article');a.dataset.new='false';a.innerHTML='<h2>牌背</h2><div class="back">'+backSVG()+'</div><p><a href="back-sample.html">九款新版牌背與舊版對照 →</a></p>';grid.append(a);}
const jobs=[];
for(const card of CARDS){if(only&&!only.includes(card.id))continue;const e=PRINTS[card.id],a=document.createElement('article');a.dataset.new=String(!!e);a.id=card.id;a.innerHTML=`<h2>${card.romanNumeral} · ${card.nameZh}</h2><div class="pair"><figure><figcaption>BEFORE · 原版</figcaption>${faceSVG(card)}</figure><figure class="after"><figcaption>AFTER · ${e?(e.status==='approved'?'已確認新版':'最新樣張'):'尚未重繪'}</figcaption>${e?'<div class="pending">正在載入新版…</div>':'<div class="pending">待重繪</div>'}</figure></div>`;grid.append(a);if(e)jobs.push({card,e,a});}
let loaded=0;
for(const {card,e,a} of jobs){try{const img=new Image();img.alt=card.nameZh+'最新重繪';img.src=`assets/${card.id}-sample.png`;let media;try{await img.decode();media=img;}catch{media=await printCard(e.plates(card),{seed:e.seed,scale:3,inks:e.inks,quietAreas:e.quietAreas});media.setAttribute('aria-label',img.alt);}a.querySelector('.pending').replaceWith(media);const link=document.createElement('a');link.className='download';link.textContent='下載新版 PNG';link.download=card.id+'-sample.png';link.href=media instanceof HTMLCanvasElement?media.toDataURL('image/png'):img.src;a.querySelector('.after').append(link);}catch{a.querySelector('.pending').textContent='載入失敗，請重新整理';}document.getElementById('progress').textContent=`已載入 ${++loaded} / ${jobs.length} 張新版`;}
document.getElementById('toggle').addEventListener('click',event=>{const button=event.currentTarget,on=button.getAttribute('aria-pressed')!=='true';button.setAttribute('aria-pressed',String(on));button.textContent=on?'顯示全部牌面':'只看已有新版的牌';for(const a of grid.children)a.hidden=on&&a.dataset.new!=='true';});
</script></body></html>
