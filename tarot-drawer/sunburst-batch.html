<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Sunburst · 第一批 1–3 號</title><style>
*{box-sizing:border-box}body{margin:0;background:#e8e4dc;color:#302c27;font:14px system-ui}main{max-width:1440px;margin:auto;padding:28px 20px 64px}h1{font-size:27px;margin:10px 0}h2{font-size:23px}p,li{line-height:1.8;color:#655e54}.intro{max-width:850px}a{color:inherit;text-underline-offset:4px}.controls{display:flex;flex-wrap:wrap;gap:20px;align-items:center;margin:20px 0}button{padding:9px 17px;font:inherit;background:#fbf7ee;border:1px solid #beb4a5;border-radius:22px;cursor:pointer}canvas{display:block;width:100%;height:auto;border-radius:10px;box-shadow:0 12px 30px -20px #302010aa}#overview{border-radius:0;box-shadow:none}.stages{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:22px}figure{margin:0}figcaption{font-size:13px;margin-bottom:12px}.download{display:inline-block;margin-top:12px}article{padding-top:26px;border-top:1px solid #c8bfb1;margin-top:38px}.audit{max-width:950px;padding:16px 20px;background:#f4eee3;border-left:3px solid #a68558;margin-top:24px}.detail{max-width:600px;margin-top:24px}.thumb{width:120px;margin-top:20px}.ref{max-width:240px;margin-top:20px}.ref img{width:100%}.status{letter-spacing:2px;color:#866e4d}details{margin:24px 0}.masks{width:230px}#progress{min-height:24px}
</style></head><body><main><div class="status">SUNBURST · BATCH 01</div><h1>魔術師、女祭司、皇后</h1><p class="intro">延續已確認愚者的 PNG 墨線 → Web 上色與套印流程。維持原網站 3:5 比例，每張輸出 900 × 1500。這三張為新流程樣張，象徵查核結論待你判斷。</p><div class="controls"><label>排線黏墨 <input id="spread" type="range" min="0" max="0.5" step="0.05" value="0.5"></label><button id="render">重新印製本批</button><a href="fool-pipeline.html">已確認的愚者</a><a href="docs/tarot-sunburst/batch-01/review.md">查核紀錄</a></div><p id="progress" role="status">正在印製…</p><canvas id="overview" aria-label="本批三張成圖總覽"></canvas><p><a id="overview-download" download="sunburst-batch-01.png">下載總覽</a></p><div id="cards"></div></main>
<script type="module">
import {buildBatch} from './src/print/sunburst/batch-pipeline.js';
import {BATCH,BATCHES} from './src/print/sunburst/registry.js';
import {cardById} from './src/data/cards.js';
const requested=new URLSearchParams(location.search).get('batch')||'01';
const batchId=Object.hasOwn(BATCHES,requested)?requested:'01',batch=BATCHES[batchId];
const hasFinishing=batch.numbers.every(n=>Boolean(BATCH[n].finishing));
document.title='Sunburst · 第 '+batchId+' 批';
document.querySelector('h1').textContent=batch.title;
document.querySelector('.status').textContent='SUNBURST · BATCH '+batchId;
document.querySelector('.intro').textContent='延續已確認愚者的 PNG 墨線 → Web 上色與套印流程。維持原網站 3:5，每張輸出 900 × 1500，排線黏墨 0.5。每批查核另有紀錄，所有新樣張仍待你判斷。';
if(hasFinishing)document.querySelector('.intro').textContent=`直接加工你的 ${batch.numbers.map(n=>'line/'+n+'.png').join('、')}：保留構圖與原輪廓，處理主次線重、細微抖動與依物件轉折安排的木刻陰影。再用 Web 上色與套印，3:5、900 × 1500、黏墨 0.5。本批完成後暫停，等你確認。`;
document.querySelector('a[href$="review.md"]').href=`docs/tarot-sunburst/batch-${batchId}/review.md`;
const nav=document.createElement('nav');nav.className='controls';for(const [id,b]of Object.entries(BATCHES)){const a=document.createElement('a');a.href='?batch='+id;a.textContent=id+' · '+b.title;nav.append(a);}document.querySelector('.controls').after(nav);
const inkReview=document.createElement('section');if(hasFinishing){inkReview.id='ink-review';inkReview.innerHTML='<h2>墨線疏密對照 · 愚者／'+batch.title.replaceAll('、','／')+'</h2><p>相同比例比較第二階段：保留原輪廓，依各張牌的衣褶、物件材質與體積轉折處理木刻陰影。</p><canvas id=ink-comparison></canvas><a id=ink-comparison-download class=download download=ink-comparison.png>下載墨線對照</a>';document.getElementById('cards').before(inkReview);}
if(hasFinishing){for(const [href,title]of [['#ink-review','墨線疏密對照'],...(batchId==='02'?[['#hand-review','教皇持杖手放大'],['#angel-review','戀人天使墨線放大']]:[['#ink-detail-1','魔術師墨線放大'],['#ink-detail-2','女祭司墨線放大'],['#ink-detail-3','皇后墨線放大']])]){const a=document.createElement('a');a.href=href;a.textContent=title;document.querySelector('.controls').append(a);}}
const titles={smooth:'1 · 你的原始平滑線稿',ink:'2 · 主次墨線與木刻加工',flat:'3 · 色版上色／無網點',final:'4 · 最終套印樣張'};
const audit={
 1:'直接加工原線稿。四器、上舉右手／指地左手、無限符號、銜尾蛇、玫瑰與百合保留；衣褶與木桌的陰影分材質處理。本批完成後暫停。',
 2:'直接加工原線稿，補上 B／J、TORA 識別文字；原人物、雙手與卷軸輪廓保留。披衣半遮卷軸的差異另列查核紀錄。',
 3:'直接加工原線稿；保留原王冠與飾紋，只依既有要求將外弧整理為十二星。裙褶、椅墊、樹與瀑布分區排線；原稿其餘符號差異另列查核。',
};
const put=(el,cv)=>{el.width=cv.width;el.height=cv.height;el.getContext('2d').drawImage(cv,0,0);};
async function render(){const button=document.getElementById('render');button.disabled=true;const cards=document.getElementById('cards');cards.replaceChildren();const sheet=document.getElementById('overview');sheet.width=960;sheet.height=550;const inkSheet=document.getElementById('ink-comparison');let inkG;if(inkSheet){inkSheet.width=1280;inkSheet.height=550;inkG=inkSheet.getContext('2d');inkG.fillStyle='#e8e4dc';inkG.fillRect(0,0,1280,550);const ref=new Image();ref.src='docs/tarot-sunburst/fool-pipeline/fool-ink-3x5.png';await ref.decode();inkG.drawImage(ref,10,0,300,500);inkG.fillStyle='#39352e';inkG.textAlign='center';inkG.font='20px serif';inkG.fillText('愚者 · 已確認參照',160,532);}
const g=sheet.getContext('2d');g.fillStyle='#e8e4dc';g.fillRect(0,0,960,550);try{
 for(const [index,number] of batch.numbers.entries()){document.getElementById('progress').textContent=`正在印製 ${index+1} / ${batch.numbers.length}…`;const card=cardById(BATCH[number].id),result=await buildBatch(number,{inkSpread:Number(document.getElementById('spread').value)});const a=document.createElement('article');a.id=card.id;a.innerHTML=`<h2>${card.romanNumeral} · ${card.nameZh}</h2><div class="stages"></div><p class="audit">${audit[number]||(batchId==='02'?'直接加工原線稿：不改構圖、人物、姿勢、衣裝與器物；本批完成後暫停。原線稿的象徵差異另列於查核紀錄。':'本張象徵查核與成圖差異請見本批查核紀錄。')}</p><figure class="thumb"><figcaption>120px 縮圖</figcaption><canvas></canvas></figure><figure class="detail"><figcaption>人物與器物局部</figcaption><canvas></canvas></figure><details><summary>區域遮罩與可重用色版</summary><canvas class="masks"></canvas><p class="plates"></p></details><details><summary>原彩色參照（原始比例）</summary><figure class="ref"><img src="docs/tarot-sunburst/color-spec-with-effect-demo/${number}.png" alt="${card.nameZh}原彩色參照"></figure></details>`;cards.append(a);
  for(const [key,title] of Object.entries(titles)){const f=document.createElement('figure');f.innerHTML=`<figcaption>${title}</figcaption><canvas></canvas><a class="download" download="${number}-${key}-3x5.png">下載 PNG</a>`;put(f.querySelector('canvas'),result[key]);f.querySelector('a').href=result[key].toDataURL();a.querySelector('.stages').append(f);}
  if(inkG){inkG.drawImage(result.ink,(index+1)*320+10,0,300,500);inkG.fillStyle='#39352e';inkG.fillText(card.nameZh,(index+1)*320+160,532);}
  if(number===5){const hand=document.createElement('figure');hand.id='hand-review';hand.style.maxWidth='960px';hand.style.marginTop='24px';hand.innerHTML='<figcaption>持杖手放大 · 原線稿／加工墨線／套印黏墨 0.5</figcaption><canvas></canvas>';a.querySelector('.audit').after(hand);const hc=hand.querySelector('canvas');hc.width=900;hc.height=380;const hg=hc.getContext('2d');hg.fillStyle='#e8e4dc';hg.fillRect(0,0,900,380);const m=BATCH[number].map,sx=(m.x+533*1024/819*m.scale)*3,sy=(m.y+399*1536/1229*m.scale)*3,sw=56*1024/819*m.scale*3,sh=75*1536/1229*m.scale*3;for(const [i,key]of ['smooth','ink','final'].entries())hg.drawImage(result[key],sx,sy,sw,sh,i*300+10,0,280,375);const hd=document.createElement('a');hd.textContent='下載手指放大對照';hd.download='5-hand-detail.png';hd.href=hc.toDataURL();hand.append(hd);}
  if(number===6){const angel=document.createElement('figure');angel.id='angel-review';angel.style.maxWidth='900px';angel.style.marginTop='24px';angel.innerHTML='<figcaption>戀人 · 天使墨線放大 · 翅膀與衣褶分區重排</figcaption><canvas></canvas>';a.querySelector('.audit').after(angel);const ac=angel.querySelector('canvas');ac.width=900;ac.height=559;ac.getContext('2d').drawImage(result.inkMaster,100*1024/819,180*1536/1229,620*1024/819,385*1536/1229,0,0,900,559);const ad=document.createElement('a');ad.textContent='下載天使墨線放大';ad.download='6-angel-detail.png';ad.href=ac.toDataURL();angel.append(ad);}
  if(batchId==='01'){const rects={1:[235,330,370,370],2:[262,430,292,365],3:[218,402,360,450]},labels={1:'魔術師 · 袖褶、手勢與四器墨線',2:'女祭司 · 衣褶、手與卷軸墨線',3:'皇后 · 袖褶與坐姿衣褶墨線'},[x,y,w,h]=rects[number];const fig=document.createElement('figure');fig.id='ink-detail-'+number;fig.style.maxWidth='720px';fig.style.marginTop='24px';fig.innerHTML=`<figcaption>${labels[number]}</figcaption><canvas></canvas>`;a.querySelector('.audit').after(fig);const cv=fig.querySelector('canvas');cv.width=720;cv.height=Math.round(720*h/w);cv.getContext('2d').drawImage(result.inkMaster,x*1024/819,y*1536/1229,w*1024/819,h*1536/1229,0,0,cv.width,cv.height);const link=document.createElement('a');link.textContent='下載墨線放大';link.download=number+'-ink-detail.png';link.href=cv.toDataURL();fig.append(link);}
  put(a.querySelector('.thumb canvas'),result.final);const d=a.querySelector('.detail canvas');d.width=750;d.height=750;d.getContext('2d').drawImage(result.final,70*3,130*3,160*3,160*3,0,0,750,750);put(a.querySelector('.masks'),result.masks);
  for(const [key,cv]of Object.entries({...result.sourcePlates,masks:result.masks,...(BATCH[number].finishing?{'ink-master':result.inkMaster}:{})})){const link=document.createElement('a');link.textContent=key+' 版　';link.download=key==='ink-master'?`${number}-ink.png`:`${number}-${key}-source.png`;link.href=cv.toDataURL();a.querySelector('.plates').append(link);}
  g.drawImage(result.final,index*320+10,0,300,500);g.fillStyle='#39352e';g.textAlign='center';g.font='20px serif';g.fillText(card.nameZh,index*320+160,532);
 }
 if(inkSheet)document.getElementById('ink-comparison-download').href=inkSheet.toDataURL();
 document.getElementById('overview-download').href=sheet.toDataURL();document.getElementById('overview-download').download=`sunburst-batch-${batchId}.png`;document.getElementById('progress').textContent=`第 ${batchId} 批 ${batch.numbers.join('、')} 號已完成。${hasFinishing?'已暫停，等待你確認。':''}請查看成圖與本批查核紀錄。`;
 }catch(error){document.getElementById('progress').textContent='印製失敗：'+error.message;throw error;}finally{button.disabled=false;}}
document.getElementById('render').addEventListener('click',render);await render();
</script></body></html>
