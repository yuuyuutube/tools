<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>愚者 · PNG 木刻試印</title><style>
*{box-sizing:border-box}body{margin:0;background:#e8e4dc;color:#292721;font:14px system-ui}main{max-width:1400px;margin:auto;padding:28px 20px}h1{font-size:25px;margin:8px 0}p{line-height:1.7;color:#6e675b}.controls{display:flex;gap:20px;flex-wrap:wrap;align-items:center;margin:22px 0}button,a{color:inherit}button{font:inherit;padding:8px 16px;border:1px solid #bab1a3;border-radius:20px;background:#fffaf0;cursor:pointer}#stages{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:22px}figure{margin:0}figcaption{font-size:13px;margin:0 0 12px}canvas{width:100%;height:auto;border-radius:10px;box-shadow:0 12px 30px -20px #302010aa}.download{display:inline-block;margin-top:12px}#status{min-height:24px}details{margin:36px 0}#mask{width:240px}#detail{max-width:650px;border-radius:4px}.reference{max-width:280px;width:100%;border-radius:10px}section{margin:36px 0}.note{max-width:850px}a{ text-underline-offset:4px }
</style></head><body><main><div>THE FOOL · RASTER INK / WEB PRINT</div><h1>愚者 · 完整製作流程試樣</h1><p class="note">維持網站原有 3:5 比例。墨線母稿由線稿修整而來；區域上色、網點、印刷質感與牌框文字由程式合成。這是獨立試樣，尚未替換正式牌組。</p><div class="controls"><label><input id="jitter" type="checkbox" checked> 輕微抖動／套色</label><label><input id="grain" type="checkbox" checked> 墨線飛白</label><label>排線黏墨 <input id="spread" type="range" min="0" max="0.5" step="0.05" value="0.5"></label><button id="render">重新試印</button><a href="gallery.html">回圖鑑</a></div><p id="status" role="status">正在製作各階段樣張…</p><div id="stages"></div><section><h2>局部：人物、手與木刻陰影</h2><canvas id="detail"></canvas></section><details><summary>查看上色區域遮罩與製作限制</summary><p>每一種顏色代表一個上色區域。遮罩由人工指定，封閉區域再依墨線校正；開放地景保留手工區域。影像生成可能改變局部細節，因此這份遮罩是本張專用，不能直接套用其他牌。</p><canvas id="mask"></canvas><p id="downloads"></p></details><section><h2>原始彩色效果參照</h2><p>保留原檔，作為畫風與配色參考；尺寸為原先的 2:3，未拉伸成新版。</p><img class="reference" src="docs/tarot-sunburst/color-spec-with-effect-demo/0.png" alt="原始彩色效果參照"></section></main><script type="module">
import {buildFool} from './src/print/sunburst/fool-pipeline.js';
const titles={smooth:'1 · 原線稿／等比例排入',ink:'2 · 主次墨線＋木刻陰影',flat:'3 · 區域上色／無網點',final:'4 · 套印、網點與紙紋'};
const put=(el,cv)=>{el.width=cv.width;el.height=cv.height;el.getContext('2d').drawImage(cv,0,0);};
async function render(){const button=document.getElementById('render');button.disabled=true;document.getElementById('status').textContent='正在校正遮罩與印製…';try{
 const result=await buildFool({jitter:document.getElementById('jitter').checked,grain:document.getElementById('grain').checked,inkSpread:Number(document.getElementById('spread').value)});
 const stages=document.getElementById('stages');stages.replaceChildren();
 for(const [key,title]of Object.entries(titles)){const f=document.createElement('figure');f.innerHTML=`<figcaption>${title}</figcaption><canvas></canvas><a class="download" download="fool-${key}-3x5.png">下載 PNG</a>`;put(f.querySelector('canvas'),result[key]);f.querySelector('a').href=result[key].toDataURL('image/png');stages.append(f);}
 put(document.getElementById('mask'),result.masks);const d=document.getElementById('detail');d.width=780;d.height=720;d.getContext('2d').drawImage(result.final,82*3,125*3,130*3,120*3,0,0,780,720);
 const links=document.getElementById('downloads');links.replaceChildren();for(const [key,cv]of Object.entries({...result.sourcePlates,inkAlpha:result.inkAlpha})){const a=document.createElement('a');a.textContent=`${key} 版　`;a.href=cv.toDataURL();a.download=`fool-${key}-source.png`;links.append(a);}
 document.getElementById('status').textContent=`完成 · 900 × 1500／3:5 · 固定種子 20261117 · 校正 ${result.snapped} 個封閉區域`;window.foolPipelineDone=true;
 }catch(error){document.getElementById('status').textContent='試印失敗：'+error.message;throw error;}finally{button.disabled=false;}}
document.getElementById('render').addEventListener('click',render);await render();
</script></body></html>
