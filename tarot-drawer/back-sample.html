<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>牌背收藏 · 抽牌所</title>
<style>*{box-sizing:border-box}body{margin:0;padding:28px;background:#e8e4dc;color:#24221f;font-family:system-ui,sans-serif}main{max-width:1000px;margin:auto}h1{font-size:20px;margin:0 0 8px}.intro{font-size:13px;color:#716b63;margin:0 0 26px}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:24px}figure{margin:0;text-align:center}figcaption{margin-bottom:18px}h2{font-size:16px;font-weight:500;margin:0 0 6px}figcaption p{font-size:12px;color:#716b63;margin:0}.large{display:block;width:100%;max-width:330px;height:auto;margin:auto;border-radius:16px;box-shadow:0 14px 26px -16px #40302080}.thumb{display:block;width:100px;margin:24px auto 0;border-radius:5px}a{display:inline-block;text-decoration:none;margin:20px 0;padding:10px 18px;border:1px solid #c7c0b5;border-radius:24px;background:#fbfaf6;color:#24221f;font-size:13px}@media(max-width:760px){.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:480px){.cards{grid-template-columns:1fr}}@media(max-width:600px){body{padding:18px}.cards{gap:18px}.large{border-radius:10px}h2{font-size:14px}figcaption p{font-size:11px}}</style>
<main><h1>抽牌所 · 牌背收藏</h1><p class="intro">同樣的手工印刷質感，各自的顏色與裝飾語言。每款皆為 180° 旋轉對稱。</p><div class="cards" id="cards"></div></main>
<script type="module">
import {BACK_DESIGNS} from './src/print/back-catalog.js?v=flower-geometry-1';
const grid=document.getElementById('cards');
const only=new URLSearchParams(location.search).get('only');
const selected=only?.split(',');
if(selected?.length===1){grid.style.gridTemplateColumns='1fr';document.querySelector('main').style.maxWidth='500px';}
if(!selected||selected.includes('legacy')){
 const legacy=document.createElement('figure');
 legacy.innerHTML='<figcaption><h2>BEFORE · 最初版本</h2><p>原始平面 SVG 牌背，保留作畫風對照</p></figcaption><img class="large" src="./assets/card-back-legacy.svg" alt="最初版本牌背"><img class="thumb" src="./assets/card-back-legacy.svg" alt="最初版本縮圖"><a href="./assets/card-back-legacy.svg" download>下載舊版 SVG</a>';
 grid.append(legacy);
}
for(const design of BACK_DESIGNS.filter(d=>!selected||selected.includes(d.id))){
 const figure=document.createElement('figure');
 figure.innerHTML=`<figcaption><h2>AFTER · ${design.name}</h2><p>${design.description}</p></figcaption><canvas class="large" aria-label="${design.name}"></canvas><canvas class="thumb" aria-label="${design.name}縮圖"></canvas><a id="download-${design.id}" download="${design.asset}">下載 ${design.name} PNG</a>`;
 grid.append(figure);
 const cv=await design.print();
 for(const el of figure.querySelectorAll('canvas')){el.width=cv.width;el.height=cv.height;el.getContext('2d').drawImage(cv,0,0);}
 figure.querySelector('a').href=cv.toDataURL('image/png');
}
</script></html>
