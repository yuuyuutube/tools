<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大阿爾卡那・墨稿套色試看</title><link rel="icon" href="assets/icon.svg" type="image/svg+xml"><style>
*{box-sizing:border-box}body{margin:0;background:#e8e5de;color:#1e284a;font:15px/1.65 system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:30px 24px}header{margin-bottom:24px}h1{font-size:25px;margin:0 0 8px}p{color:#6d6a63;margin:0}section{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:50px;align-items:center}.stage{display:grid;place-items:center;min-height:540px}.card{width:min(300px,75vw);aspect-ratio:3/5;perspective:1200px}.face{width:100%;height:100%;border-radius:16px;overflow:hidden;box-shadow:0 5px 15px #29241e24;background:#f6efe0}.face svg{display:block;width:100%;height:100%}aside{background:#f7f2e8;border-radius:16px;padding:24px}h2{font-size:19px;min-height:58px;margin:0 0 8px}.note{font-size:13px;margin-bottom:18px}label{display:block;font-size:13px;font-weight:650}select,input[type=range]{width:100%;margin:8px 0 14px}input[type=range]{accent-color:#1e284a}output{font-variant-numeric:tabular-nums;font-size:12px;color:#6d6a63}button,select{font:inherit;border:1px solid #d6cfc0;border-radius:9px;color:inherit;background:#fffaf2;padding:8px 12px;cursor:pointer}button.primary{background:#1e284a;color:#f7f2e8;border-color:#1e284a}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}ol{padding-left:20px;font-size:13px;color:#6d6a63;margin:0}li{margin:7px 0}footer{font-size:12px;margin-top:24px;color:#6d6a63}a{color:inherit}@media(max-width:700px){main{padding:22px 16px}section{grid-template-columns:1fr;gap:20px}.stage{min-height:0}.card{width:min(260px,72vw)}h2{min-height:0}}
</style><main><header><h1>1–21 · 墨線先現，色版隨後套印</h1><p>用與定稿牌面相同的原始色版逐張試看。插畫位置與裁切沿用網站牌面。</p></header><section><div class="stage"><div class="card"><div class="face" id="face"></div></div></div><aside><h2 id="phase" role="status">正在載入牌面…</h2><p class="note" id="status">依愚者印刷引擎製版：加入網點、紙齒、墨邊、黏墨與套印位移。</p><label for="pick">選擇牌</label><select id="pick"></select><label for="timeline">停在任一階段檢查</label><input id="timeline" type="range" min="0" max="1600" step="10" value="0" disabled><output id="time">0.00 秒</output><div class="buttons"><button id="play" class="primary" disabled>重播</button><button id="ink" disabled>看未上色墨稿</button><button id="final" disabled>看完成卡面</button></div><ol><li>墨稿與圖窗外框一起出現。</li><li>黃、朱橘、藍色版加入網點與套印偏移。</li><li>最後與同一批印刷結果的完整插圖銜接。</li></ol></aside></section><footer>這是 1–21 號牌的檢查頁；每張都使用該牌設定的插圖位置。正式抽牌流程也已套用相同的印刷翻牌。<br><a href="index.html">回到抽牌網站</a></footer></main><script type="module" src="src/ui/light-paint-reveal.js"></script></html>
