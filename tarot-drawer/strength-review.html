<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>力量 · 結構修訂</title>
<style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#e8e4dc;color:#24221f;font:14px system-ui}main{max-width:1000px;margin:auto}h1{font-size:20px;margin:0 0 8px}p{color:#716b63;font-size:13px;margin:0 0 22px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:28px}figure{margin:0;text-align:center}figcaption{margin-bottom:12px}canvas{width:100%;height:auto;max-width:350px;display:block;margin:auto;border-radius:16px;box-shadow:0 14px 26px -16px #40302080}.detail{max-width:800px;margin:28px auto}.detail canvas{max-width:800px;border-radius:6px}a{display:inline-block;color:#24221f;background:#fbfaf6;border:1px solid #c7c0b5;padding:10px 18px;border-radius:24px;text-decoration:none;margin:18px 0}@media(max-width:600px){body{padding:16px}.pair{gap:16px}}</style>
<main><h1>VIII · 力量 · 結構與色版修訂</h1><p>後側手臂的軀幹遮擋、花朵分色、四肢肌肉與收整後的手指線。</p><div class="pair"><figure><figcaption>BEFORE · 本輪修改前</figcaption><canvas id="before"></canvas></figure><figure><figcaption>AFTER · 修正版</figcaption><canvas id="after"></canvas><a id="download" download="strength-sample.png">下載力量 PNG</a></figure></div><figure class="detail"><figcaption>局部 · 雙手、獅頭與袖口</figcaption><canvas id="detail"></canvas></figure><figure class="detail"><figcaption>局部 · 四肢、關節與腳掌</figcaption><canvas id="feet"></canvas></figure></main>
<script type="module">
import {cardById} from './src/data/cards.js';import {printCard} from './src/print/press.js';import {strengthPlates,STRENGTH_INKS,STRENGTH_QUIET} from './src/print/strength.js';import {strengthPlates as before,STRENGTH_QUIET as quietBefore} from './src/print/strength-before-depth-repair.js';
for(const [id,draw]of [['before',before],['after',strengthPlates]]){const cv=await printCard(draw(cardById('strength')),{seed:20261120,scale:3,inks:STRENGTH_INKS,quietAreas:id==='after'?STRENGTH_QUIET:quietBefore});const el=document.getElementById(id);el.width=cv.width;el.height=cv.height;el.getContext('2d').drawImage(cv,0,0);if(id==='after'){document.getElementById('download').href=cv.toDataURL('image/png');const detail=document.getElementById('detail');detail.width=480;detail.height=330;detail.getContext('2d').drawImage(cv,75*3,175*3,160*3,110*3,0,0,480,330);const feet=document.getElementById('feet');feet.width=420;feet.height=300;feet.getContext('2d').drawImage(cv,140*3,285*3,140*3,100*3,0,0,420,300);}}
</script></html>
