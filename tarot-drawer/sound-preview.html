<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>翻牌音效試聽｜小小塔羅印刷所</title>
<style>body{margin:0;background:#e8e5de;color:#1e284a;font:16px/1.7 system-ui,sans-serif}main{max-width:620px;margin:48px auto;padding:24px}h1{font-size:26px;margin:0 0 8px}p{color:#6d6a63}section{background:#f7f2e8;border-radius:16px;margin:24px 0;padding:22px}h2{font-size:18px;margin:0 0 12px}audio{display:block;width:100%}a{color:inherit;text-underline-offset:4px}small{display:block;color:#6d6a63;margin-top:12px}#status{font-size:13px}</style>
<main><h1>翻牌音效試聽</h1><p>新版以輕柔微風帶出牌面，再接上緩緩亮起的星光尾韻。</p><section><h2>新版 · 微風與星光</h2><audio id="new" controls preload="auto"></audio><small>單次翻牌，沒有落桌的低頻撞擊。</small></section><section><h2>舊版 · 紙張與落點</h2><audio id="old" controls preload="auto"></audio></section><p><a href="index.html" target="_blank" rel="noopener">回抽牌網站試聽</a>　<a id="download">下載新版音效</a></p><small>抽牌網站需開啟右上角音效；這裡試聽不會更改你的音效開關。</small><p id="status" role="status">正在準備試聽…</p></main>
<script type="module">
import {revealSound} from './src/audio/reveal.js';
import {seeded} from './src/engine/random.js';
function noise(c){const b=c.createBuffer(1,c.sampleRate*.5,c.sampleRate),d=b.getChannelData(0),rnd=seeded(8715);for(let i=0;i<d.length;i++)d[i]=rnd()*2-1;return b;}
function legacy(c,b){
 const t=c.currentTime,src=c.createBufferSource(),bp=c.createBiquadFilter(),g=c.createGain();src.buffer=b;src.loop=true;bp.type='bandpass';bp.Q.value=.8;bp.frequency.setValueAtTime(1500,t);bp.frequency.exponentialRampToValueAtTime(2400,t+.2);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.05,t+.05);g.gain.exponentialRampToValueAtTime(.0001,t+.2);src.connect(bp).connect(g).connect(c.destination);src.start(t);src.stop(t+.22);
 const o=c.createOscillator(),hit=c.createGain();o.type='sine';o.frequency.setValueAtTime(170,t+.34);o.frequency.exponentialRampToValueAtTime(85,t+.43);hit.gain.setValueAtTime(.06,t+.34);hit.gain.exponentialRampToValueAtTime(.0001,t+.45);o.connect(hit).connect(c.destination);o.start(t+.34);o.stop(t+.47);
}
function wav(b){const samples=b.getChannelData(0),bytes=new ArrayBuffer(44+samples.length*2),v=new DataView(bytes);const str=(i,s)=>{for(let j=0;j<s.length;j++)v.setUint8(i+j,s.charCodeAt(j));};str(0,'RIFF');v.setUint32(4,36+samples.length*2,true);str(8,'WAVE');str(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,b.sampleRate,true);v.setUint32(28,b.sampleRate*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);str(36,'data');v.setUint32(40,samples.length*2,true);for(let i=0;i<samples.length;i++)v.setInt16(44+i*2,Math.round(Math.max(-1,Math.min(1,samples[i]))*32767),true);return new Blob([bytes],{type:'audio/wav'});}
try{
 const stats=[];
 for(const [id,play]of [['new',revealSound],['old',legacy]]){
  const c=new OfflineAudioContext(1,Math.ceil(1.8*44100),44100);play(c,noise(c));const buffer=await c.startRendering(),d=buffer.getChannelData(0);let peak=0;for(const sample of d){if(!Number.isFinite(sample))throw Error('音效產生失敗');peak=Math.max(peak,Math.abs(sample));}stats.push({id,peak});const url=URL.createObjectURL(wav(buffer));document.getElementById(id).src=url;if(id==='new'){const a=document.getElementById('download');a.href=url;a.download='tarot-flip-breeze.wav';}
 }
 document.getElementById('status').textContent='已準備好，可以按播放比較。';document.getElementById('status').dataset.audioCheck=JSON.stringify(stats);
}catch(e){document.getElementById('status').textContent=e.message;}
</script></html>
