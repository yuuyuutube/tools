<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>隱者與月亮 · 符號修訂對照</title>
<style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#e8e4dc;color:#24221f;font-family:system-ui,sans-serif}main{max-width:960px;margin:auto}h1{font-size:20px;margin:0 0 10px}h2{font-size:17px;margin:28px 0 8px}.intro{font-size:13px;color:#716b63;margin:0 0 20px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:28px}figure{margin:0;text-align:center}figcaption{font-size:13px;margin-bottom:12px}canvas{display:block;width:100%;max-width:330px;height:auto;margin:auto;border-radius:5.4% / 3.2%;box-shadow:0 14px 26px -16px #40302080}a{display:inline-block;padding:10px 18px;background:#fbfaf6;border:1px solid #c7c0b5;border-radius:24px;color:#24221f;font-size:13px;text-decoration:none;margin:16px 0}.small{width:120px;margin-top:20px}@media(max-width:600px){body{padding:16px}.pair{gap:16px}}</style>
<main><h1>隱者與月亮 · 圖像符號修訂</h1><p class="intro">相同尺寸、印刷種子與配色，比較本輪修改前後。</p><div id="cards"></div></main>
<script type="module">
import {cardById} from './src/data/cards.js';import {printCard} from './src/print/press.js';
import {hermitPlates as hermitBefore} from './src/print/hermit-before-symbols.js';import {hermitPlates} from './src/print/hermit.js?v=symbols-2';
import {moonPlates as moonBefore,MOON_INKS as moonBeforeInks} from './src/print/moon-before-symbols.js';import {moonPlates,MOON_INKS} from './src/print/moon.js?v=symbols-2';
const selected=new URLSearchParams(location.search).get('only');
for(const item of [
 {id:'hermit',title:'IX · 隱者',note:'六芒星光源、抬高並向外伸出的提燈、保留寬袖與遠側手遮擋',seed:20261115,before:hermitBefore,after:hermitPlates},
 {id:'moon',title:'XVIII · 月亮',note:'右側亮面、16 主芒＋16 副芒、十五枚露滴、仰望月亮的犬與狼',seed:20261116,before:moonBefore,after:moonPlates,inks:MOON_INKS,beforeInks:moonBeforeInks},
]){
 if(selected&&selected!==item.id)continue;
 const section=document.createElement('section');section.innerHTML=`<h2>${item.title}</h2><p class="intro">${item.note}</p><div class="pair"><figure><figcaption>BEFORE · 本輪修改前</figcaption><canvas id="${item.id}-before"></canvas></figure><figure><figcaption>AFTER · 符號修訂</figcaption><canvas id="${item.id}-after"></canvas><canvas class="small" id="${item.id}-small"></canvas><a id="download-${item.id}" download="${item.id}-sample.png">下載${item.title.split(' · ')[1]} PNG</a></figure></div>`;document.getElementById('cards').append(section);
 for(const [state,draw]of [['before',item.before],['after',item.after]]){
  const cv=await printCard(draw(cardById(item.id)),{seed:item.seed,scale:3,...(item.inks?{inks:state==='before'?item.beforeInks:item.inks}:{})});
  for(const id of [item.id+'-'+state,...(state==='after'?[item.id+'-small']:[])]){const el=document.getElementById(id);el.width=cv.width;el.height=cv.height;el.getContext('2d').drawImage(cv,0,0);}
  if(state==='after')document.getElementById('download-'+item.id).href=cv.toDataURL('image/png');
 }
}
</script></html>
