<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>愚者 · 套印翻牌試作</title><link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<style>
*{box-sizing:border-box}body{margin:0;background:#e8e5de;color:#1e284a;font:15px/1.65 system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:30px 24px}header{margin-bottom:26px}h1{font-size:25px;margin:0 0 8px}p{color:#6d6a63;margin:0}section{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:50px;align-items:center}.stage{display:grid;place-items:center;min-height:540px}.card{width:min(300px,75vw);aspect-ratio:3/5;perspective:1200px}.flip{position:relative;width:100%;height:100%;transform-style:preserve-3d}.back,.face{position:absolute;inset:0;border-radius:16px;overflow:hidden;backface-visibility:hidden;box-shadow:0 5px 15px #29241e24}.back{background:#f6efe0 url('assets/backs/card-back.webp') center/100% 100%}.face{transform:rotateY(180deg);background:#f6efe0}.face svg{display:block;width:100%;height:100%}aside{background:#f7f2e8;border-radius:16px;padding:24px}h2{font-size:19px;min-height:60px;margin:0 0 8px}.note{font-size:13px;margin-bottom:22px}label{display:block;font-size:13px;font-weight:650}input[type=range]{width:100%;accent-color:#1e284a;margin:12px 0 4px}output{font-variant-numeric:tabular-nums;font-size:12px;color:#6d6a63}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0 18px}button,select{font:inherit;border:1px solid #d6cfc0;border-radius:9px;color:inherit;background:#fffaf2;padding:8px 12px;cursor:pointer}button.primary{background:#1e284a;color:#f7f2e8;border-color:#1e284a}button:disabled,input:disabled{opacity:.45;cursor:wait}select{margin:6px 0 20px}ol{padding-left:20px;font-size:13px;color:#6d6a63;margin:0}li{margin:7px 0}footer{font-size:12px;margin-top:26px;color:#6d6a63}a{color:inherit}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #ca6842;outline-offset:3px}@media(max-width:700px){main{padding:24px 18px}section{grid-template-columns:1fr;gap:24px}.stage{min-height:0}.card{width:min(260px,72vw)}h2{min-height:0}header{margin-bottom:24px}}
</style>
<main><header><h1>愚者 · 墨線先現，色版隨後套印</h1><p>0 號牌的獨立動效試作。墨稿與外框一起露出，上色、展框與牌名動效交錯進行。</p></header><section><div class="stage"><div class="card"><div class="flip" id="flip"><div class="back"></div><div class="face" id="face"></div></div></div></div><aside><h2 id="phase" role="status">正在準備原始印版…</h2><p class="note" id="status">首次載入需稍候，會從原稿計算網點、黏墨及套印錯位。</p><label for="timeline">停在任一階段檢查</label><input id="timeline" type="range" min="0" max="1600" step="10" value="0" disabled><output id="time" for="timeline">0.00 秒</output><div class="buttons"><button id="play" class="primary" disabled>重播翻牌</button><button id="ink" disabled>看未上色墨稿</button><button id="final" disabled>看完成卡面</button></div><label for="speed">播放速度</label><select id="speed"><option value="1">正常</option><option value=".55">慢速檢查</option></select><ol><li>墨稿與圖窗外框一起露出。</li><li>黃、朱橘與藍快速交疊套印。</li><li>上色同時展框、拉線與浮現牌名。</li></ol></aside></section><footer>使用原始印版，插畫的位置、大小不動。此頁供試看，正式抽牌流程維持現狀。<br><a href="index.html">回到抽牌網站</a></footer></main><script type="module" src="src/ui/fool-reveal-demo.js"></script></html>
