<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="240" height="240" role="img" aria-labelledby="inkling-title inkling-desc" data-character="inkling" data-mood="neutral">
  <title id="inkling-title">墨團學徒</title>
  <desc id="inkling-desc">圓蓬蓬的紫色毛球墨團，四周有短短毛邊，身上帶粉紅與群青色紋。</desc>
  <!-- Handwritten SVG. Face proportions and facial marks follow stamp-tour/js/attendant.js. -->
  <style>
    .eyes { transform-origin:60px 58px; animation:npc-blink 4.2s infinite; }
    .happy, .mouth-open { opacity:0; }
    svg[data-mood="happy"] .eyes { opacity:0; }
    svg[data-mood="happy"] .happy { opacity:1; }
    svg[data-talking="true"] .mouth-open { animation:npc-mouth .26s steps(1) infinite; }
    svg[data-talking="true"] .mouth-closed { animation:npc-mouth .26s steps(1) infinite reverse; }
    @keyframes npc-blink { 0%,93%,100% { transform:scaleY(1); } 95.5% { transform:scaleY(.1); } }
    @keyframes npc-mouth { 0% { opacity:1; } 50% { opacity:0; } }
    @media (prefers-reduced-motion:reduce) { .eyes { animation:none; } svg[data-talking="true"] .mouth-open, svg[data-talking="true"] .mouth-closed { animation:none; } }
  </style>
  <defs>
    <clipPath id="inkling-body-clip">
      <path d="M51 18 L55 13 L61 17 Q66 12 70 18 L77 16 L79 23 Q87 20 88 28
        L96 28 L95 36 Q104 37 102 45 L109 49 L104 55 Q111 62 105 66
        L109 73 L102 77 Q104 85 96 87 L96 94 L88 94 Q85 102 78 99
        L73 106 L66 102 Q59 109 54 103 L47 107 L43 100 Q35 104 32 96
        L24 97 L25 89 Q16 88 18 80 L11 76 L16 69 Q9 64 15 58
        L11 51 L18 47 Q15 39 23 36 L22 29 L30 28 Q32 20 40 23
        L44 16 L51 18 Z"/>
    </clipPath>
  </defs>
  <!-- A round fuzzball: short tufts all around, with no flame tips or detached drops. -->
  <g clip-path="url(#inkling-body-clip)">
    <path d="M0 0 H120 V120 H0 Z" fill="#6562BB"/>
    <path d="M5 81 C27 70 37 82 54 84 C71 87 79 71 111 75 L120 92 C90 84 82 101 64 99 C38 98 23 84 5 95 Z" fill="#DB78A6"/>
    <path d="M20 98 C40 87 50 101 65 98 C85 92 95 98 107 93 L110 115 L14 115 Z" fill="#304CA6"/>
  </g>

  <!-- A few quiet curved fur marks; keep the face area clear. -->
  <g fill="none" stroke="#504DA1" stroke-width="1.8" stroke-linecap="round">
    <path d="M29 43 Q25 48 28 52"/>
    <path d="M86 35 Q91 38 90 42"/>
    <path d="M30 82 Q32 87 37 87"/>
  </g>
  <g class="eyes">
    <circle cx="50" cy="58" r="2.8" fill="#24221F"/>
    <circle cx="70" cy="58" r="2.8" fill="#24221F"/>
  </g>
  <g class="happy" fill="none" stroke="#24221F" stroke-width="2.4" stroke-linecap="round">
    <path d="M46 60 Q50 54.5 54 60"/><path d="M66 60 Q70 54.5 74 60"/>
  </g>
  <path class="mouth-closed" d="M54 72 Q60 79 66 72" fill="none" stroke="#24221F" stroke-width="2.4" stroke-linecap="round"/>
  <path class="mouth-open" d="M54.5 71 Q60 83 65.5 71 Z" fill="#24221F"/>
</svg>
