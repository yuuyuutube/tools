<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="board-title"><title id="board-title">INK INK 三個 NPC 臉部試作</title><rect width="1200" height="680" fill="#ECEBE7"/><g font-family="PingFang TC,Noto Sans TC,sans-serif" fill="#24221F"><text x="54" y="58" font-size="12" letter-spacing="3">INK INK / CHARACTER STUDIES</text><text x="54" y="107" font-size="30" font-weight="600">工作室裡，可能有這三位。</text><path d="M54 135 H1146" stroke="#24221F"/><rect x="54" y="164" width="348" height="450" rx="3" fill="#F7F4EE"/><text x="76" y="198" font-size="12">01</text><svg x="103" y="205" width="250" height="250" viewBox="0 0 120 120">
  <title id="print-master-title">絹印師傅</title>
  <desc id="print-master-desc">戴群青工作帽、鬢角花白，留著一撮小灰鬍子，沒有畫嘴巴的絹印師傅。</desc>
  <!-- Handwritten SVG. Face proportions and facial marks follow stamp-tour/js/attendant.js. -->
  
  <!-- Same bun-shaped face and eye coordinates as the station attendant. -->
  <path d="M20 70 C20 40 38 26 60 26 C82 26 100 40 100 70 C100 94 84 104 60 104 C36 104 20 94 20 70 Z" fill="#F3E3CF"/>
  <!-- Short grey sideburns, a soft work cap, and a rolled ultramarine brim. -->
  <path d="M22 48 Q23 33 33 30 L32 46 L24 57 Z" fill="#A09E92"/>
  <path d="M88 30 Q98 35 98 48 L96 57 L88 46 Z" fill="#A09E92"/>
  <path d="M25 34 L29 20 Q32 9 57 9 Q82 7 89 20 L94 35 Z" fill="#253A80"/>
  <path d="M26 29 Q59 23 93 29 L94 40 Q60 35 25 41 Z" fill="#304CA6"/>
  <path d="M36 29 L38 34 L42 32 L41 27 Z" fill="#FF48B0"/>
  <path d="M79 31 L83 32 L82 36 L78 34 Z" fill="#FFE800"/>
  <!-- One real-looking ink stain, drawn with two simple flat shapes. -->
  <path d="M84 75 Q89 72 92 76 L90 82 Q85 84 83 80 Z" fill="#304CA6"/>
  <circle cx="80" cy="84" r="1.5" fill="#304CA6"/>
<g fill="none" stroke="#767366" stroke-width="2" stroke-linecap="round"><path d="M46 50 L54 50"/><path d="M66 50 L74 50"/></g>
  <g class="eyes">
    <circle cx="50" cy="58" r="2.8" fill="#24221F"/>
    <circle cx="70" cy="58" r="2.8" fill="#24221F"/>
  </g>
  
  <!-- A little two-part grey moustache. No mouth is drawn underneath. -->
  <g class="moustache" fill="#8A877A">
    <path d="M59 69 C55 67 52 71 49 74 C53 77 58 76 59 72 Z"/>
    <path d="M61 69 C65 67 68 71 71 74 C67 77 62 76 61 72 Z"/>
  </g>
</svg><text x="78" y="499" font-size="25" font-weight="600">絹印師傅</text><text x="78" y="532" font-size="13">對墨水很龜毛，對客人很寬容。</text><text x="78" y="576" font-size="12" fill="#77756E">小灰鬍子 ／ 不畫嘴巴 ／ 群青工作帽</text><rect x="426" y="164" width="348" height="450" rx="3" fill="#F7F4EE"/><text x="448" y="198" font-size="12">02</text><svg x="475" y="205" width="250" height="250" viewBox="0 0 120 120">
  <title id="inkling-title">墨團學徒</title>
  <desc id="inkling-desc">圓蓬蓬的紫色毛球墨團，四周有短短毛邊，身上帶粉紅與群青色紋。</desc>
  <!-- Handwritten SVG. Face proportions and facial marks follow stamp-tour/js/attendant.js. -->
  
  <defs>
    <clipPath id="inkling-body-clip">
      <path d="M51 18 L55 13 L61 17 Q66 12 70 18 L77 16 L79 23 Q87 20 88 28
        L96 28 L95 36 Q104 37 102 45 L109 49 L104 55 Q111 62 105 66
        L109 73 L102 77 Q104 85 96 87 L96 94 L88 94 Q85 102 78 99
        L73 106 L66 102 Q59 109 54 103 L47 107 L43 100 Q35 104 32 96
        L24 97 L25 89 Q16 88 18 80 L11 76 L16 69 Q9 64 15 58
        L11 51 L18 47 Q15 39 23 36 L22 29 L30 28 Q32 20 40 23
        L44 16 L51 18 Z"/>
    </clipPath>
  </defs>
  <!-- A round fuzzball: short tufts all around, with no flame tips or detached drops. -->
  <g clip-path="url(#inkling-body-clip)">
    <path d="M0 0 H120 V120 H0 Z" fill="#6562BB"/>
    <path d="M5 81 C27 70 37 82 54 84 C71 87 79 71 111 75 L120 92 C90 84 82 101 64 99 C38 98 23 84 5 95 Z" fill="#DB78A6"/>
    <path d="M20 98 C40 87 50 101 65 98 C85 92 95 98 107 93 L110 115 L14 115 Z" fill="#304CA6"/>
  </g>

  <!-- A few quiet curved fur marks; keep the face area clear. -->
  <g fill="none" stroke="#504DA1" stroke-width="1.8" stroke-linecap="round">
    <path d="M29 43 Q25 48 28 52"/>
    <path d="M86 35 Q91 38 90 42"/>
    <path d="M30 82 Q32 87 37 87"/>
  </g>
  <g class="eyes">
    <circle cx="50" cy="58" r="2.8" fill="#24221F"/>
    <circle cx="70" cy="58" r="2.8" fill="#24221F"/>
  </g>
  
  <path class="mouth-closed" d="M54 72 Q60 79 66 72" fill="none" stroke="#24221F" stroke-width="2.4" stroke-linecap="round"/>
  
</svg><text x="450" y="499" font-size="25" font-weight="600">墨團學徒</text><text x="450" y="532" font-size="13">很想學會印刷，明明自己就是墨。</text><text x="450" y="576" font-size="12" fill="#77756E">圓蓬蓬毛球 ／ 短短毛邊 ／ 混色色紋</text><rect x="798" y="164" width="348" height="450" rx="3" fill="#F7F4EE"/><text x="820" y="198" font-size="12">03</text><svg x="847" y="205" width="250" height="250" viewBox="0 0 120 120">
  <title id="studio-regular-title">隔壁桌常客</title>
  <desc id="studio-regular-desc">戴粉紅針織帽的文青長髮男，頭髮微捲、兩邊都有眉毛，臉型是略方的圓角矩形。</desc>
  <!-- Handwritten SVG. Face proportions and facial marks follow stamp-tour/js/attendant.js. -->
  
  <!-- Long wavy hair sits behind a softly squared face. -->
  <path class="hair-back" d="M31 25 C20 24 14 32 18 41 C11 45 13 53 17 57
    C10 64 14 73 17 77 C10 85 14 94 21 97 C15 105 23 112 31 108
    C35 116 46 112 49 104 L73 104 C77 114 87 115 91 107
    C101 110 109 102 103 95 C111 89 107 80 103 76 C109 68 105 61 102 57
    C108 49 104 40 98 37 C101 28 91 21 84 25 C70 14 47 13 31 25 Z" fill="#302C29"/>
  <path class="face" d="M45 29 H75 Q94 29 94 48 V83 Q94 102 75 102
    H45 Q26 102 26 83 V48 Q26 29 45 29 Z" fill="#F3E3CF"/>
  <!-- Two softly curled locks frame the forehead; neither covers the eyebrows. -->
  <path class="hair-front" d="M29 35 C36 29 46 31 49 38 C49 44 44 47 39 44
    C34 43 34 49 36 53 C29 54 25 47 29 42 C24 40 25 37 29 35 Z" fill="#302C29"/>
  <path class="hair-front" d="M79 34 C87 29 96 34 94 41 C99 45 96 53 90 55
    C87 51 90 47 88 44 C84 47 79 44 80 40 C82 39 83 36 79 34 Z" fill="#302C29"/>
  <!-- Sparse waves keep the long silhouette readable at small sizes. -->
  <g class="hair-waves" fill="none" stroke="#62554E" stroke-width="1.8" stroke-linecap="round">
    <path d="M22 62 C18 68 25 71 21 77 C18 82 22 87 25 88"/>
    <path d="M98 62 C103 69 96 73 100 79 C104 85 98 90 96 93"/>
    <path d="M29 97 Q25 103 31 104"/>
    <path d="M86 102 Q90 107 94 102"/>
  </g>
  <path d="M27 31 Q25 12 42 10 L69 8 Q88 9 91 29 L93 38 L28 40 Z" fill="#D95A89"/>
  <path d="M25 28 Q57 23 94 29 L95 40 Q61 35 25 41 Z" fill="#FF8AB5"/>
  <!-- Ribbing is deliberately sparse, at the same line weight as the mouth. -->
  <g fill="none" stroke="#D95A89" stroke-width="2" stroke-linecap="round">
    <path d="M32 31 L32 36"/><path d="M39 30 L39 35"/><path d="M46 29 L46 34"/>
    <path d="M53 29 L53 34"/><path d="M60 29 L60 34"/>
  </g>
  <!-- A tiny paper scrap gets caught in the hat. -->
  <path d="M75 27 L84 29 L82 38 L73 36 Z" fill="#F7F4EE"/>
  <path d="M77 30 L81 31 L80 34 L76 33 Z" fill="#FFE800"/>
  <g class="eyebrows" fill="none" stroke="#24221F" stroke-width="2" stroke-linecap="round">
    <path d="M45 49 Q50 46 54 48"/>
    <path d="M66 48 Q71 46 75 49"/>
  </g>
  <g class="eyes">
    <circle cx="50" cy="58" r="2.8" fill="#24221F"/>
    <circle cx="70" cy="58" r="2.8" fill="#24221F"/>
  </g>
  
  <path class="mouth-closed" d="M55 72 Q61 77 67 70" fill="none" stroke="#24221F" stroke-width="2.4" stroke-linecap="round"/>
  
</svg><text x="822" y="499" font-size="25" font-weight="600">隔壁桌常客</text><text x="822" y="532" font-size="13">每天都來，永遠在印奇怪的東西。</text><text x="822" y="576" font-size="12" fill="#77756E">雙眉 ／ 微捲長髮 ／ 圓角方臉</text><text x="54" y="650" font-size="11" fill="#77756E">全手寫 SVG · 沿用站務員的簡潔五官 · 三位角色的第二版臉部提案</text></g></svg>
