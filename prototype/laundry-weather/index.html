<div class="about-content"><p id="source-detail"></p><p id="station-detail"></p><p id="score-detail"></p><p>本站指標為初始啟發式規則，非官方指數，也不預測晾乾時間。實際乾燥速度受到衣料、脫水與通風影響。</p><p>場景依天氣現象作概略呈現；日夜以臺灣時間 06–18 時區分。</p><p><a href="https://opendata.cwa.gov.tw/dataset/observation/O-A0001-001" target="_blank" rel="noopener">氣象署觀測資料</a> · <a href="https://opendata.cwa.gov.tw/dataset/all/F-D0047-089" target="_blank" rel="noopener">鄉鎮預報資料</a></p></div><nav id="demo-controls" class="demo-controls" aria-label="展示天氣"><button data-demo="sunny" aria-label="展示晴朗" title="展示晴朗" aria-pressed="true"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-sun"/></svg></button><button data-demo="cloudy" aria-label="展示多雲" title="展示多雲" aria-pressed="false"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-cloud"/></svg></button><button data-demo="humid" aria-label="展示潮濕" title="展示潮濕" aria-pressed="false"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-drop"/></svg></button><button data-demo="rainy" aria-label="展示下雨" title="展示下雨" aria-pressed="false"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-rain"/></svg></button></nav></dialog>
