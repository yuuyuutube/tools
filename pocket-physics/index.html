</head>
<body>
  <svg class="svg-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-mark" viewBox="0 0 32 32"><circle cx="16" cy="16" r="13"/><path d="m10 23 12-14M11 9h11v14"/><circle cx="11" cy="9" r="2" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><rect x="14" y="14" width="6" height="6" rx="1.5"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v6M12 7v.1"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M9 6v12M15 6v12" stroke-width="2.5"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="m9 5 10 7-10 7Z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-reset" viewBox="0 0 24 24"><path d="M5 10a7.5 7.5 0 1 1 1 7M5 5v5h5"/></symbol>
    <symbol id="i-reverse" viewBox="0 0 24 24"><path d="M8 4v16m-4-4 4 4 4-4M16 20V4m-4 4 4-4 4 4"/></symbol>
    <symbol id="i-float" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2M5 19l2-2M17 7l2-2"/></symbol>
    <symbol id="i-rotate" viewBox="0 0 24 24"><path d="M5 9a7.5 7.5 0 0 1 13-3l2 3M20 4v5h-5M19 15a7.5 7.5 0 0 1-13 3l-2-3M4 20v-5h5"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M12 20V4m-6 6 6-6 6 6"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M4 12h15m-6-6 6 6-6 6"/></symbol>
    <symbol id="i-breathe" viewBox="0 0 32 32"><path d="M4 12h15a4 4 0 1 0-4-4M4 17h22a3 3 0 1 1-3 3M7 22h7"/><circle cx="25" cy="6" r="2"/></symbol>
    <symbol id="i-mic" viewBox="0 0 32 32"><rect x="12" y="3" width="8" height="16" rx="4"/><path d="M8 14v2a8 8 0 0 0 16 0v-2M16 24v5m-5 0h10"/></symbol>
    <symbol id="i-add-bubble" viewBox="0 0 24 24"><circle cx="10" cy="14" r="6"/><path d="M18 2v8m-4-4h8"/></symbol>
    <symbol id="i-release" viewBox="0 0 24 24"><path d="M4 10c3-5 5 5 8 0s5 5 8 0M4 16c3-5 5 5 8 0s5 5 8 0"/></symbol>
    <symbol id="i-note" viewBox="0 0 24 24"><path d="M14 16V4l6 2v4l-6-2"/><ellipse cx="10.5" cy="17.5" rx="3.5" ry="2.5"/></symbol>
    <symbol id="i-notes" viewBox="0 0 24 24"><path d="M9 16V5l11-2v12M9 9l11-2"/><ellipse cx="6" cy="17" rx="3" ry="2.5"/><ellipse cx="17" cy="16" rx="3" ry="2.5"/></symbol>
    <symbol id="i-sound" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4ZM17 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></symbol>
    <symbol id="i-muted" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4Zm13 1 5 5m0-5-5 5"/></symbol>
  </svg>

  <div class="app-shell">
    <header class="header">
      <a class="brand" href="./" aria-label="Pocket Physics 首頁"><svg class="brand-mark"><use href="#i-mark"/></svg><span>pocket physics</span></a>
      <nav aria-label="展品導覽" class="header-actions">
        <button class="collection-button" id="collection-open" aria-haspopup="dialog"><svg><use href="#i-grid"/></svg><span>藏品</span><span class="collection-count">4</span></button>
        <button class="icon-button next-exhibit" id="next-exhibit" aria-label="切換至不破的泡泡" title="下一件藏品"><svg><use href="#i-next"/></svg></button>
        <button class="icon-button" id="notes-open" aria-label="玩法與物理規則" aria-haspopup="dialog"><svg><use href="#i-info"/></svg></button>
      </nav>
    </header>

    <main class="room" id="exhibit-room">
      <div class="exhibit-heading"><h1>反重力<br>沙漏</h1></div>

      <div class="artwork" id="artwork">
        <canvas id="hourglass" tabindex="0" role="slider" aria-label="沙漏旋轉角度。拖曳轉動，左右方向鍵調整，Home 回正。" aria-valuemin="-180" aria-valuemax="180" aria-valuenow="-12" aria-valuetext="負 12 度" aria-describedby="gesture-hint">你的瀏覽器需要支援 Canvas 才能體驗反重力沙漏。</canvas>
        <div class="angle-indicator" aria-hidden="true"><svg><use href="#i-rotate"/></svg><span id="angle-value">−12°</span></div>
        <div class="gesture-hint" id="gesture-hint"><span class="gesture-line"></span><span>拖曳沙漏，轉個方向</span></div>
      </div>

      <aside class="field-panel" aria-label="重力控制">
        <div class="field-header"><h2>重力</h2><output id="gravity-value" for="strength">1.00<span> g</span></output></div>
        <div class="gravity-dial" id="gravity-dial" tabindex="0" role="slider" aria-label="重力方向。拖曳指針，方向鍵調整。" aria-valuemin="0" aria-valuemax="359" aria-valuenow="0" aria-valuetext="向上" aria-describedby="dial-hint">
          <svg class="dial-face" viewBox="0 0 200 200" aria-hidden="true">
            <circle class="dial-track" cx="100" cy="100" r="83"/>
            <path class="dial-ticks" d="M100 11v7M100 182v7M11 100h7M182 100h7M37 37l5 5m116 116 5 5M37 163l5-5m116-116 5-5"/>
            <circle class="dial-orbit" cx="100" cy="100" r="57"/>
            <g id="dial-needle"><path class="dial-needle" d="M100 142V43m-10 12 10-12 10 12"/><circle class="dial-end" cx="100" cy="17" r="5"/></g>
            <circle class="dial-center" cx="100" cy="100" r="4"/>
          </svg>
        </div>
        <p class="dial-hint" id="dial-hint">拖曳指針改變方向</p>
        <label class="range-label" for="strength"><span>力道</span><span class="range-extents">0 — 2</span></label>
        <input id="strength" class="range" type="range" min="0" max="2" step="0.05" value="1" aria-label="重力強度">
        <button class="float-button" id="float" aria-pressed="false"><svg><use href="#i-float"/></svg><span>失重</span><span class="toggle-track" aria-hidden="true"><span></span></span></button>
      </aside>

      <div class="transport" role="group" aria-label="沙漏播放控制">
        <button class="icon-button play-button" id="pause" aria-label="暫停" aria-pressed="false" title="暫停 / 播放（空白鍵）"><svg><use href="#i-pause"/></svg></button>
        <span class="transport-divider" aria-hidden="true"></span>
        <button class="transport-button" id="reverse" title="反轉重力（R）"><svg><use href="#i-reverse"/></svg><span>反轉</span></button>
        <button class="icon-button reset-button" id="reset" aria-label="重置沙漏" title="重置（Home）"><svg><use href="#i-reset"/></svg></button>
      </div>
      <div class="quiet-status" aria-live="polite" id="status"></div>
    </main>

    <footer class="footer"><span class="footer-rule"><span class="live-dot" id="live-dot"></span><span id="flow-state">反向重力</span></span></footer>
  </div>

  <dialog id="notes-dialog" class="sheet" aria-labelledby="notes-title">
    <div class="sheet-top"><h2 id="notes-title">玩法與規則</h2><button class="icon-button" data-close aria-label="關閉說明"><svg><use href="#i-close"/></svg></button></div>
    <div class="notes-body">
      <dl><dt>轉動</dt><dd>拖曳沙漏，或聚焦後按左右方向鍵。</dd><dt>引力</dt><dd>拖曳圓盤指針；方向鍵微調，Home 指向上方。力道降至零，讓沙粒停留在空中。</dd><dt>反轉</dt><dd>將引力翻向另一邊，看細砂穿過瓶頸。</dd></dl>
      <div class="science-note"><h3>真實的計算，虛構的重力。</h3><p>每粒砂都會受到力、彼此碰撞並受玻璃邊界限制。這是二維圓粒模型，不是精確的流沙模擬。你能獨立轉動容器與重力場；失重時，阻尼會逐漸消散砂粒的動量。</p></div>
      <p class="keyboard-note">空白鍵 暫停　R 反轉　Home 重置</p>
    </div>
  </dialog>

  <dialog id="collection-dialog" class="sheet collection-sheet" aria-labelledby="collection-title">
    <div class="sheet-top"><h2 id="collection-title">藏品</h2><button class="icon-button" data-close aria-label="關閉藏品"><svg><use href="#i-close"/></svg></button></div>
    <button class="exhibit-entry hourglass-entry" id="hourglass-entry" data-exhibit="hourglass" aria-current="page"><span class="mini-hourglass" aria-hidden="true"><svg viewBox="0 0 100 120"><path d="M22 10h56c0 26-23 29-23 50s23 24 23 50H22c0-26 23-29 23-50S22 36 22 10Z"/><path class="mini-sand" d="M31 105h38L50 79Z"/><path class="mini-stream" d="M50 42v30"/></svg></span><span><strong>反重力沙漏</strong></span><svg class="entry-check"><use href="#i-check"/></svg></button>
    <button class="exhibit-entry bubble-entry" id="bubble-entry" data-exhibit="bubble"><span class="mini-bubbles" aria-hidden="true"><svg viewBox="0 0 100 120"><circle cx="55" cy="50" r="29"/><circle cx="26" cy="82" r="18"/><circle cx="78" cy="92" r="11"/><path d="M35 44a22 22 0 0 1 13-14"/></svg></span><span><strong>不破的泡泡</strong></span><svg class="entry-check"><use href="#i-check"/></svg></button>
    <button class="exhibit-entry mirror-entry" id="mirror-entry" data-exhibit="mirror"><span class="mini-mirror" aria-hidden="true"><svg viewBox="0 0 100 120"><circle cx="50" cy="60" r="38"/><path d="m26 43 33-9 19 22-9 30-33-2-15-24Zm15 8 15-5 10 12-4 14-15-1-8-11Z"/><path d="m26 43 15 8m18-17-3 12m22 10-12 2M69 86l-7-14m-26 12 11-13M21 60h18"/></svg></span><span><strong>四維鏡子</strong></span><svg class="entry-check"><use href="#i-check"/></svg></button>
    <button class="exhibit-entry liquid-entry" id="liquid-entry" data-exhibit="liquid"><span class="mini-liquid" aria-hidden="true"><svg viewBox="0 0 100 120"><ellipse cx="50" cy="65" rx="39" ry="22"/><path d="M11 65v8c0 29 78 29 78 0v-8M19 64q16-18 31 0t31 0M30 54q10 12 20 0t20 0"/><path class="liquid-note" d="M57 37V18l11-3v18m-11-10 11-3"/><ellipse class="liquid-note" cx="53" cy="38" rx="4" ry="3"/><ellipse class="liquid-note" cx="64" cy="34" rx="4" ry="3"/></svg></span><span><strong>聲音液體</strong></span><svg class="entry-check"><use href="#i-check"/></svg></button>
  </dialog>
  <noscript><div class="no-script">請啟用 JavaScript 來操作藏品。</div></noscript>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
