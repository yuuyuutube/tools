name: Update laundry weather
on:
  schedule:
    - cron: '7,27,47 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: laundry-weather-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: bucket
        run: echo "key=$(date -u +%Y%m%d)-$((10#$(date -u +%H)/6))" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: laundry-weather/.weather-cache
          key: laundry-forecast-v1-${{ steps.bucket.outputs.key }}
      - name: Fetch official weather
        working-directory: laundry-weather
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
          WEATHER_OUTPUT: ${{ runner.temp }}/laundry-weather.json
        run: node scripts/publish-weather.js
      - uses: actions/checkout@v4
        with:
          ref: weather-data
          path: weather-output
      - name: Publish data only
        working-directory: weather-output
        run: |
          cp "${{ runner.temp }}/laundry-weather.json" laundry-weather.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add laundry-weather.json
          git diff --cached --quiet && exit 0
          git commit -m 'Update official laundry weather'
          git push origin HEAD:weather-data
